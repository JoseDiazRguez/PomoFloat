name: Tests

# Se ejecutan los test cuando se haga un push o haya un Pull Request sobre main o develop
on:
  push:
    branch:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

  # También se ejecuta manualmente desde GitHub: Actions/Tests/Run workflow
  workflow_dispatch:

# Leer código
permissions:
  contents: read


jobs:
  tests:
    # Se crea máquina temporal Linux para el test
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      # Se comprueba que funciona en tres versiones
      fail-fast: false    # Si uno falla no se cancela los siguientes
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"

    steps:
      # Descargar repositorio PomoFloat dentro del runner
      - name: Checkout repository
        uses: actions/checkout@v7

      # Instalar Python
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Ejecutar este comando dentro de la máquina virtual de GitHub
      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      # Instalar PomoFloat
      - name: Install project
        run: pip install -e .

      # Instalar dependencias de testing
      - name: Install test dependencies
        run: pip install -r requirements.txt

      # Ejecuta los tests
      - name: Run tests
        run: pytest -v

